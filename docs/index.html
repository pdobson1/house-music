<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Music · proof of concept</title>
  <meta name="description" content="Album listening parties in people's homes in Lancaster. Proof of concept.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:wght@400;500&family=Libre+Baskerville:ital@0;1&family=Playfair+Display:wght@700&family=Inter:wght@400;500&family=Source+Serif+4:ital@0;1&family=Archivo+Black&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500&family=Oswald:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the page paints, so there is no flash of the default look.
    try { var t = localStorage.getItem('house-music-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="demo-bar"><div id="demo"></div></div>
  <header class="site" id="header"></header>
  <main id="main"><noscript>This demo needs JavaScript switched on.</noscript></main>
  <footer class="site">Lancaster, Lancashire. One album, on repeat, all evening. Please drink responsibly.</footer>
  <dialog id="recipe" aria-labelledby="recipe-title">
    <div class="recipe-head">
      <h2 id="recipe-title"></h2>
      <button class="btn small ghost" data-close>Close</button>
    </div>
    <div id="recipe-body"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
